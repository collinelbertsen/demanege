      <line y2="28.03" x2="11" y1="22.39" x1="11" class="est"></line>
      <line y2="28.03" x2="23" y1="22.39" x1="23" class="est"></line>
      
      <line style="stroke-width:.18" y2="22.39" x2="42.12" y1="22.39" x1="0" class="thin"></line>
      
