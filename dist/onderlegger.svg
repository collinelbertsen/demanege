<svg xmlns="http://www.w3.org/2000/svg" aria-label="Plattegrond: rechthoek van 42,12 bij 28,03 meter met een strook van 5,64 meter langs de zuidzuidoostgevel en een grote hal" role="img" viewBox="0 0 54 39"><style>text{font-family:Arial,sans-serif;fill:#243a35}.lbl{font-weight:600}.sub{fill:#65716a}.estt{fill:#a05a2b}.wall{fill:none;stroke:#33444a;stroke-width:.32}.thin{fill:none;stroke:#33444a;stroke-width:.06}.est{fill:none;stroke:#a05a2b;stroke-width:.09;stroke-dasharray:.45 .3}.dim{fill:none;stroke:#2a5d86;stroke-width:.05}.dimt{fill:#2a5d86}.ridge{fill:none;stroke:#66767b;stroke-width:.06;stroke-dasharray:1.2 .3 .2 .3}.f-strip{fill:#e6ecef}.f-hall{fill:#eef2f1}.f-stal{fill:#efe9e1}.glass{stroke:#2a5d86;stroke-width:.16;fill:none}</style>
    <defs>
