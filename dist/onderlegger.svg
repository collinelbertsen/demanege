      <path d="M11 13.2 v3" class="est"></path>
      <text class="estt" font-size=".45" y="14.9" x="11.4">dubbele deur</text>
      
      <rect height="28.03" width="42.12" y="0" x="0" class="wall"></rect>
      
      <text text-anchor="middle" class="lbl" font-size="1.25" y="10.6" x="26.5">RIJHAL</text>
      <text text-anchor="middle" class="sub" font-size=".6" y="11.8" x="26.5">ca. 30,8 × 22,4 m · ca. 690 m²</text>
      <text text-anchor="middle" class="sub" font-size=".55" y="12.7" x="26.5">stalen vakwerkspanten, houten gordingen</text>
      <text text-anchor="middle" class="lbl" font-size=".62" y="4.0" x="7.75">STAL / OPSLAG</text>
      <text text-anchor="middle" class="estt" font-size=".45" y="4.8" x="7.75">diepte ca. 11 m?</text>
      <text text-anchor="middle" class="lbl" font-size=".7" y="25.0" x="5.5">WERKRUIMTE</text>
      <text text-anchor="middle" class="sub" font-size=".5" y="25.8" x="5.5">systeemplafond</text>
      <text text-anchor="middle" class="lbl" font-size=".7" y="25.0" x="17">GANG · SANITAIR</text>
      <text text-anchor="middle" class="sub" font-size=".5" y="25.8" x="17">kleedruimtes?</text>
      <text text-anchor="middle" class="lbl" font-size=".7" y="25.0" x="31.5">KANTINE MET BAR</text>
      <text text-anchor="middle" class="sub" font-size=".5" y="25.8" x="31.5">ramen naar rijhal en naar buiten</text>
      
      <line style="stroke:#243a35;stroke-width:.07;stroke-dasharray:1.5 .4" y2="30" x2="39.5" y1="-2" x1="39.5"></line>
      <path style="fill:#243a35" d="M38.9 -2.4 h1.2 l-.6 -.8z"></path>
